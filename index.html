
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Cartoon Video Maker</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;
padding:18px;max-width:700px;margin:auto}
h1{color:#67e8f9}
textarea,input,select,button{width:100%;box-sizing:border-box;
padding:13px;margin:8px 0;border-radius:9px;font-size:16px}
textarea{height:180px}
button{background:#06b6d4;color:#001018;border:0;font-weight:bold}
.panel{background:#1e293b;padding:16px;border-radius:12px;margin-top:15px}
video{width:100%;margin-top:12px}
small{color:#cbd5e1}
</style>
</head>
<body>
<h1>🎬 AI Cartoon Video Maker</h1>
<p>अपनी हिंदी कहानी डालें और कार्टून वीडियो बनाने का अनुरोध भेजें।</p>

<div class="panel">
<label>अपनी कहानी लिखें</label>
<textarea id="story" placeholder="यहाँ अपनी पूरी हिंदी कहानी लिखें..."></textarea>

<label>वीडियो की शैली</label>
<select id="style">
<option>3D Cartoon</option>
<option>3D Animated Movie</option>
<option>Kids Cartoon</option>
</select>

<label>वीडियो की अवधि</label>
<select id="duration">
<option value="30">30 सेकंड — परीक्षण</option>
<option value="60">1 मिनट</option>
<option value="300">5 मिनट</option>
<option value="900">15 मिनट</option>
</select>

<button id="generate" onclick="generateVideo()">
वीडियो जनरेट करें
</button>

<p id="status">अभी कोई वीडियो जनरेट नहीं हुआ है।</p>
<video id="player" controls hidden></video>
<a id="download" hidden download="cartoon-video.mp4">
वीडियो डाउनलोड करें
</a>
</div>

<script>
async function generateVideo() {
  const story = document.getElementById("story").value.trim();
  const style = document.getElementById("style").value;
  const duration = Number(document.getElementById("duration").value);
  const status = document.getElementById("status");
  const button = document.getElementById("generate");
  const player = document.getElementById("player");
  const download = document.getElementById("download");

  if (!story) {
    status.textContent = "पहले अपनी कहानी लिखिए।";
    return;
  }

  button.disabled = true;
  status.textContent = "वीडियो जनरेशन सेवा से संपर्क हो रहा है...";
  player.hidden = true;
  download.hidden = true;

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({story, style, duration})
    });

    if (!response.ok) {
      throw new Error("वीडियो सेवा उपलब्ध नहीं है।");
    }

    const result = await response.json();

    if (result.videoUrl) {
      player.src = result.videoUrl;
      player.hidden = false;
      download.href = result.videoUrl;
      download.hidden = false;
      status.textContent = "वीडियो तैयार है!";
    } else if (result.jobId) {
      status.textContent =
        "वीडियो बनाने का काम शुरू हुआ। जॉब ID: " + result.jobId;
    } else {
      throw new Error("वीडियो का परिणाम अभी नहीं मिला।");
    }
  } catch (error) {
    status.textContent =
      error.message + " सर्वर और AI वीडियो API जोड़ना आवश्यक है।";
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
